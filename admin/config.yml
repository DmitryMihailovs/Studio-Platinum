backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "gallery"
    label: "Gallery"
    label_singular: "Image"
    files:
      - name: "gallery_data"
        file: "data/gallery.json"
        label: "Gallery JSON"
        fields:
          - {label: "Images", name: "images", widget: "list", fields: [
              {label: "Image", name: "image", widget: "image"},
              {label: "Title", name: "title", widget: "string"},
              {label: "Description", name: "description", widget: "text"}
            ]}
backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
    - name: "works"
    label: "Работы"
    folder: "content/works"
    create: true
    slug: "{{slug}}"
    fields:
            - {label: "Название", name: "title", widget: "string"}
            - {label: "Фото", name: "image", widget: "image"}
            - {label: "Описание", name: "description", widget: "text"}
            - {label: "Материалы", name: "materials", widget: "string"}